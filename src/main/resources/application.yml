spring:
  application:
    name: eureka-flow-builder-backend
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/eurekaflowbuilder?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  profiles:
    active: local
  # redis
  data:
    redis:
      host: localhost
      port: 6379
      ttl: 3600
      database: 1
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.eureka.flowbuilder.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
# AI
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY}
      model-name: deepseek-v4-flash
      max-tokens: 16384
      #      strict-json-schema: true
      #      response-format: json_object
      log-requests: true
      log-responses: true
      max-retries: 3
    streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY}
      model-name: deepseek-v4-flash
      max-tokens: 16384
      log-requests: true
      log-responses: true
    # 推理 AI 模型配置（用于复杂的推理任务）
    reasoning-streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY}
      model-name: deepseek-reasoner
      max-tokens: 65536
      temperature: 0.1
      log-requests: true
      log-responses: true
    # 智能路由 AI 模型配置（用于简单的分类任务）
    routing-chat-model:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY}
      model-name: deepseek-v4-flash
      log-requests: true
      log-responses: true

# AI 用量与费用估算（单位：每百万 Token）
ai:
  usage:
    currency: ${AI_USAGE_CURRENCY:CNY}
    models:
      deepseek-v4-flash:
        input-price-per-million: ${DEEPSEEK_FLASH_INPUT_PRICE_PER_MILLION:0}
        output-price-per-million: ${DEEPSEEK_FLASH_OUTPUT_PRICE_PER_MILLION:0}
      deepseek-reasoner:
        input-price-per-million: ${DEEPSEEK_REASONER_INPUT_PRICE_PER_MILLION:0}
        output-price-per-million: ${DEEPSEEK_REASONER_OUTPUT_PRICE_PER_MILLION:0}

# 套餐与积分（内部余额单位 CNY；展示积分 = CNY × 100）
billing:
  min-reserve: 0.01
  min-consume: 0.01
  credit-display-factor: 100
  plans:
    free:
      name: 免费版
      description: 适合个人试用，含基础生成额度
      signup-gift: 1.00
      monthly-quota: 1.00
      app-limit: 3
      chat-rate: 5
      chat-rate-interval-seconds: 60
    pro:
      name: 专业版
      description: 适合独立开发者与小团队
      signup-gift: 0
      monthly-quota: 20.00
      app-limit: 50
      chat-rate: 20
      chat-rate-interval-seconds: 60
    enterprise:
      name: 企业版
      description: 适合企业团队，更高额度与限流
      signup-gift: 0
      monthly-quota: 200.00
      # app-limit 缺省表示不限制
      chat-rate: 60
      chat-rate-interval-seconds: 60